<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>调研路径与视频联动</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
html, body {
    margin: 0;
    height: 100%;
    font-family: "Microsoft YaHei", sans-serif;
}

#container {
    display: flex;
    height: 100%;
}

#map {
    width: 48%;
    height: 100%;
}

#panel {
    width: 52%;
    padding: 16px;
    box-sizing: border-box;
    border-left: 1px solid #ddd;
    overflow-y: auto;
    background: #fafafa;
}

video {
    width: 100%;
    height: 420px;
    background: black;
    margin-bottom: 10px;
}

button, select {
    margin: 4px 4px 8px 0;
    padding: 6px 10px;
    cursor: pointer;
}

.route-item {
    padding: 8px;
    margin-bottom: 6px;
    background: white;
    border: 1px solid #ddd;
    cursor: pointer;
    border-radius: 4px;
}

.route-item:hover {
    background: #eef5ff;
}

.route-item.active {
    background: #dbeafe;
    border-color: #2563eb;
    font-weight: bold;
}
</style>
</head>

<body>
<div id="container">
    <div id="map"></div>

    <div id="panel">
        <h3>调研路径与视频联动</h3>

        <div>
            <label>调研项目：</label>
            <select id="projectSelect"></select>
        </div>

        <video id="videoPlayer" controls preload="metadata"></video>

        <button onclick="showAllRoutes()">显示全部路径</button>
        <button onclick="playSelectedRoute()">动态播放当前路径</button>
        <button onclick="stopAnimation()">停止播放</button>

        <h4>路径列表</h4>
        <div id="routeList"></div>
    </div>
</div>

<script>
const colors = [
    "#e41a1c", "#377eb8", "#4daf4a", "#984ea3", "#ff7f00",
    "#a65628", "#f781bf", "#999999", "#1b9e77", "#d95f02",
    "#7570b3", "#e7298a", "#66a61e", "#e6ab02", "#a6761d",
    "#666666", "#00a6d6"
];

const map = L.map("map").setView([31.31, 120.61], 15);

L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: "&copy; OpenStreetMap contributors"
}).addTo(map);

let routes = [];
let routeLayers = {};
let routeCoords = {};
let selectedName = null;
let movingMarker = null;
let animationTimer = null;
let startMarker = null;
let endMarker = null;

const videoPlayer = document.getElementById("videoPlayer");
const routeList = document.getElementById("routeList");
const projectSelect = document.getElementById("projectSelect");

function getLatLngsFromGeoJSON(geojson) {
    const geom = geojson.features[0].geometry;

    let coords = [];

    if (geom.type === "LineString") {
        coords = geom.coordinates;
    } else if (geom.type === "MultiLineString") {
        coords = geom.coordinates.flat();
    } else {
        console.error("不支持的几何类型：", geom.type);
    }

    return coords.map(c => [c[1], c[0]]);
}

async function initProjects() {
    const response = await fetch("/api/projects");
    const projects = await response.json();

    projectSelect.innerHTML = "";

    projects.forEach(project => {
        const option = document.createElement("option");
        option.value = project;
        option.innerText = project;
        projectSelect.appendChild(option);
    });

    const defaultProject = projects.includes("changmen") ? "changmen" : projects[0];
    projectSelect.value = defaultProject;

    projectSelect.onchange = () => {
        loadProject(projectSelect.value);
    };

    loadProject(defaultProject);
}

async function loadProject(project) {
    clearMap();

    const response = await fetch(`/api/${project}/routes`);
    routes = await response.json();

    for (let i = 0; i < routes.length; i++) {
        const route = routes[i];

        const geojsonResponse = await fetch(route.geojson);
        const geojson = await geojsonResponse.json();

        const latlngs = getLatLngsFromGeoJSON(geojson);
        routeCoords[route.name] = latlngs;

        const layer = L.polyline(latlngs, {
            color: colors[i % colors.length],
            weight: 5,
            opacity: 0.85
        }).addTo(map);

        layer.bindTooltip(route.name, {
            sticky: true,
            direction: "top"
        });

        layer.on("mouseover", () => {
            if (selectedName !== route.name) {
                layer.setStyle({ weight: 8, opacity: 1 });
            }
        });

        layer.on("mouseout", () => {
            updateRouteStyles();
        });

        layer.on("click", () => {
            selectRoute(route.name);
        });

        routeLayers[route.name] = layer;
        addRouteListItem(route.name);
    }

    showAllRoutes();
}

function clearMap() {
    stopAnimation();

    Object.values(routeLayers).forEach(layer => {
        map.removeLayer(layer);
    });

    routeLayers = {};
    routeCoords = {};
    selectedName = null;
    routeList.innerHTML = "";

    videoPlayer.pause();
    videoPlayer.removeAttribute("src");
    videoPlayer.load();
}

function addRouteListItem(name) {
    const div = document.createElement("div");
    div.className = "route-item";
    div.innerText = name;
    div.dataset.name = name;

    div.onclick = () => {
        selectRoute(name);
    };

    routeList.appendChild(div);
}

function selectRoute(name) {
    selectedName = name;
    stopAnimation();

    const route = routes.find(r => r.name === name);

    videoPlayer.pause();
    videoPlayer.src = route.video;
    videoPlayer.load();

    updateRouteStyles();
    updateListStyles();

    const layer = routeLayers[name];
    map.fitBounds(layer.getBounds(), {
        padding: [40, 40]
    });
}

function updateRouteStyles() {
    for (const route of routes) {
        const name = route.name;
        const layer = routeLayers[name];

        if (!selectedName) {
            layer.setStyle({
                weight: 5,
                opacity: 0.85
            });
        } else if (name === selectedName) {
            layer.setStyle({
                weight: 9,
                opacity: 1
            });
            layer.bringToFront();
        } else {
            layer.setStyle({
                weight: 3,
                opacity: 0.18
            });
        }
    }
}

function updateListStyles() {
    document.querySelectorAll(".route-item").forEach(item => {
        if (item.dataset.name === selectedName) {
            item.classList.add("active");
        } else {
            item.classList.remove("active");
        }
    });
}

function showAllRoutes() {
    selectedName = null;
    stopAnimation();

    videoPlayer.pause();
    videoPlayer.removeAttribute("src");
    videoPlayer.load();

    updateRouteStyles();
    updateListStyles();

    const layers = Object.values(routeLayers);

    if (layers.length > 0) {
        const group = L.featureGroup(layers);
        map.fitBounds(group.getBounds(), {
            padding: [40, 40]
        });
    }
}

function playSelectedRoute() {
    if (!selectedName) {
        alert("请先选择一条路径");
        return;
    }

    stopAnimation();

    const latlngs = routeCoords[selectedName];

    if (!latlngs || latlngs.length === 0) {
        alert("当前路径没有坐标点");
        return;
    }

    let index = 0;

    startMarker = L.marker(latlngs[0]).addTo(map).bindPopup("起点");
    endMarker = L.marker(latlngs[latlngs.length - 1]).addTo(map).bindPopup("终点");

    movingMarker = L.circleMarker(latlngs[0], {
        radius: 8,
        color: "red",
        fillColor: "red",
        fillOpacity: 1
    }).addTo(map);

    animationTimer = setInterval(() => {
        if (index >= latlngs.length) {
            clearInterval(animationTimer);
            animationTimer = null;
            return;
        }

        movingMarker.setLatLng(latlngs[index]);

        map.panTo(latlngs[index], {
            animate: true,
            duration: 0.15
        });

        index++;
    }, 80);
}

function stopAnimation() {
    if (animationTimer) {
        clearInterval(animationTimer);
        animationTimer = null;
    }

    if (movingMarker) {
        map.removeLayer(movingMarker);
        movingMarker = null;
    }

    if (startMarker) {
        map.removeLayer(startMarker);
        startMarker = null;
    }

    if (endMarker) {
        map.removeLayer(endMarker);
        endMarker = null;
    }
}

initProjects();
</script>
</body>
</html>
